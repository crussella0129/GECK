[workspace]
resolver = "2"
members = [
    "crates/geck-core",
    "crates/geck-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "See LICENSE"
repository = "https://github.com/crussella0129/Animus_GECK"

[workspace.dependencies]
geck-core = { path = "crates/geck-core", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tera = { version = "1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
